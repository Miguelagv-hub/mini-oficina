<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1c2733; }
    h1 { color: #0379B5; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid #e1e4e8; }
  </style>
</head>
<body>
  <h1>{{ titulo }}</h1>
  {% if not tareas %}
    <p>No hay tareas todavía.</p>
  {% else %}
    <ul>
      {% for tarea in tareas %}
        <li>{{ tarea[1] }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</body>
</html>
